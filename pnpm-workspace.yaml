allowBuilds:
  '@sentry/cli': true
  browser-tabs-lock: false
  bufferutil: false
  core-js: false
  esbuild: true
  sharp: false
  unrs-resolver: false
  utf-8-validate: false
  workerd: false
minimumReleaseAgeExclude:
  - '@clerk/clerk-js@6.25.8'
  - '@clerk/expo@4.0.3'
  - '@clerk/react@6.12.8'
  - '@clerk/shared@4.25.8'
  - '@expo/cli@57.0.11'
  - '@expo/inline-modules@0.1.4'
  - '@expo/local-build-cache-provider@57.0.5'
  - '@expo/log-box@57.0.2'
  - '@expo/prebuild-config@57.0.10'
  - babel-preset-expo@57.0.5
  - expo-asset@57.0.8
  - expo-constants@57.0.8
  - expo-modules-core@57.0.8
  - expo@57.0.9
  - '@expo/metro-runtime@57.0.8'
  - '@expo/ui@57.0.8'
  - expo-router@57.0.9
  - expo-system-ui@57.0.2
  - eslint-config-expo@57.0.1
  - uuid@11.1.1
  - sharp@0.35.0
  - postcss@8.5.18
  - brace-expansion@5.0.8
overrides:
  brace-expansion@<=5.0.7: ^5.0.8
  postcss@<=8.5.17: ^8.5.18
  sharp@<0.35.0: ^0.35.0
  uuid@<11.1.1: ^11.1.1
